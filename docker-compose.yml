services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modeler
      POSTGRES_PASSWORD: modeler
      POSTGRES_DB: modeler
    volumes:
      - modeler_pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: modeler:latest
    container_name: modeler-app
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - modeler-data:/app/data
      - modeler-logs:/app/log
    environment:
      PORT: "4000"
      NODE_ENV: production
      MODELER_DATA_DIR: /app/data
      CLIENT_DIST_DIR: /app/client/dist
      LOG_LEVEL: info
      DATABASE_URL: "postgresql://modeler:modeler@postgres:5432/modeler"
    depends_on:
      - postgres
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  modeler-data:
    driver: local
  modeler-logs:
    driver: local
  modeler_pgdata:
