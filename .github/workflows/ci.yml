name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-unit:
    name: Build & Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build all packages
        run: |
          npm run build --workspace=shared
          npm run build --workspace=server
          npm run build --workspace=client
      - run: npm run test --workspace=shared
      - run: npm run test --workspace=server
      - run: npm run test --workspace=client
      # ビルド成果物 (dist) を後続 e2e ジョブへ渡し、各 e2e ジョブで再ビルドしないようにする。
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            shared/dist
            server/dist
            client/dist
          retention-days: 1
          if-no-files-found: error

  e2e:
    # PR では chromium のみ実行 (PR 体感の高速化)。
    # main への push 時のみ firefox/webkit も含むフルマトリクスで動かす。
    name: Playwright E2E (${{ matrix.browser }})
    needs: build-and-unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'push' && '["chromium","firefox","webkit"]' || '["chromium"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
      # Playwright のブラウザバイナリは playwright バージョンが変わらない限り
      # 使い回せるので actions/cache でランナー間共有する。apt 由来のシステム
      # 依存はランナー再生成で消えるため毎回入れる必要があるが、ブラウザ本体の
      # ダウンロード (50〜150MB) を削れる。
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pw-${{ runner.os }}-${{ matrix.browser }}-
      - name: Install Playwright (browser + system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install Playwright system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Run E2E
        working-directory: e2e
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
