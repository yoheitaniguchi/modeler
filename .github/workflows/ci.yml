name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで CI が連続トリガされたとき、古い run を即座に止める。
# 大量の同時 run が e2e レーンを占有して詰まるのを防ぐ。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: Build & Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Install native Linux binaries for Rollup/Esbuild (bypass Windows lockfile pruning)
        run: npm install @rollup/rollup-linux-x64-gnu @esbuild/linux-x64
      - name: Build all packages
        # client は E2E 時に root '/' で配信するため VITE_BASE で base path を上書き。
        # (deploy.yml は env を設定しないので、GitHub Pages 用の '/modeler/' を維持)
        env:
          VITE_BASE: '/'
        run: |
          npm run build --workspace=shared
          npm run build --workspace=server
          npm run build --workspace=client
      - run: npm run test --workspace=shared
      - run: npm run test --workspace=server
      - run: npm run test --workspace=client
      # ビルド成果物 (shared/server/client の dist) を tar に固めて 1 ファイルで
      # 受け渡す。actions/upload-artifact@v4 の複数 path 指定はサブディレクトリ
      # 構造の解釈が場合により崩れる (LCA が単一 path 時と違う) ので、tar で
      # ディレクトリ構造を確実に保存する。
      - name: Pack build outputs
        run: tar -czf dist.tar.gz shared/dist server/dist client/dist
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist.tar.gz
          retention-days: 1
          if-no-files-found: error

  e2e:
    # PR では chromium のみ実行 (PR 体感の高速化)。
    # main への push 時のみ firefox/webkit も含むフルマトリクスで動かす。
    # シャーディング: テストを 2 つに分割し並列ジョブで動かすことで wall clock を半減。
    # 各ジョブは別ランナーで動くので port 4000 (webServer) の競合は起きない。
    name: Playwright E2E (${{ matrix.browser }} ${{ matrix.shard }}/2)
    needs: build-and-unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'push' && '["chromium","firefox","webkit"]' || '["chromium"]') }}
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Unpack build outputs
        run: tar -xzf dist.tar.gz
      # Playwright のブラウザバイナリは playwright バージョンが変わらない限り
      # 使い回せるので actions/cache でランナー間共有する。apt 由来のシステム
      # 依存はランナー再生成で消えるため毎回入れる必要があるが、ブラウザ本体の
      # ダウンロード (50〜150MB) を削れる。
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pw-${{ runner.os }}-${{ matrix.browser }}-
      - name: Install Playwright (browser + system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install Playwright system deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Run E2E (shard ${{ matrix.shard }}/2)
        working-directory: e2e
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
