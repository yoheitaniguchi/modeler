services:
  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
      target: e2e-runner
    image: modeler-e2e:latest
    container_name: modeler-e2e
    environment:
      CI: "true"
      NODE_ENV: production
      PORT: "4000"
      MODELER_DATA_DIR: /app/e2e/.e2e-data
      CLIENT_DIST_DIR: /app/client/dist
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    # デフォルトはchromiumのみ。オーバーライド例:
    #   docker compose -f docker-compose.test.yml run e2e npx playwright test --project=firefox
